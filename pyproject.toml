[project]
name = "django-borg"
version = "0.1.0a1"
description = "AI-bootstrapped, vote-curated schema mapping for Django."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = [
  "django",
  "schema",
  "mapping",
  "etl",
  "ai",
  "ingestion",
  "ecommerce",
  "pim",
]
authors = [{ name = "Oliver Haas", email = "ohaas@e1plus.de" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["Django>=5.2,<7"]

[project.urls]
Homepage = "https://github.com/oliverhaas/django-borg"
Documentation = "https://oliverhaas.github.io/django-borg/"
Repository = "https://github.com/oliverhaas/django-borg.git"
Changelog = "https://oliverhaas.github.io/django-borg/reference/changelog/"

[dependency-groups]
dev = [
  "pre-commit==4.6.0",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "pytest-xdist==3.8.0",
  "ruff==0.15.12",
  "mypy==1.20.2",
  "django-stubs==6.0.3",
  "pytest-django==4.12.0",
]
docs = ["mkdocs==1.6.1", "mkdocs-material==9.7.6", "mike==2.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["django_borg"]

[tool.hatch.build.targets.sdist]
include = ["django_borg", "LICENSE", "README.md"]

[tool.ruff]
target-version = "py313"
line-length = 120
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D", "E501", "EM", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "ANN",
  "ARG",
  "F841",
  "FBT",
  "PT006",
  "PT011",
  "PT013",
  "PT018",
  "S101",
  "S105",
]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
pretty = true
show_error_codes = true
show_error_context = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.django-stubs]
django_settings_module = "tests.settings.base"

[tool.pytest.ini_options]
addopts = "--cov=django_borg --cov-report=term-missing --cov-report=xml --no-cov-on-fail"
testpaths = ["tests"]
xfail_strict = true
DJANGO_SETTINGS_MODULE = "settings.base"
pythonpath = ["tests"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
precision = 2
skip_covered = true
